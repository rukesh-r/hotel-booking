<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register – StayEase</title>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
<div class="container">

    <div class="login-brand">🏨 StayEase</div>
    <h2>Create Account</h2>
    <p class="login-sub">Join StayEase today</p>

    <div th:if="${error}" class="msg-error" th:text="${error}"></div>

    <form action="/users/register" method="post">
        <input type="text"     name="name"     placeholder="Full Name"      required>
        <input type="email"    name="email"    placeholder="Email address"  required>
        <input type="password" name="password" placeholder="Password (min 6 chars)" required minlength="6">
        <button type="submit">Create Account</button>
    </form>

    <a href="/loginPage">Already have an account? Login</a>

</div>
</body>
</html>
